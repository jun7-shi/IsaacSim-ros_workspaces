frames:
  map: map
  odom: odom
  base: base_link

topics:
  odom: /odom
  cmd_vel: /cmd_vel

perception:
  rgb_topic: /g1/head_rgbd/rgb/image_raw
  depth_topic: /g1/head_rgbd/depth/image_raw
  camera_info_topic: /g1/head_rgbd/camera_info
  pointcloud_topic: /g1/head_rgbd/points
  pointcloud_frame: g1_front_rgbd_optical_frame
  camera_parent_frame: base_link
  camera_xyz: [0.05366, 0.01753, 0.47387]
  camera_xyzw: [-0.659252482, 0.659252482, -0.255707186, 0.255707186]
  voxel_point_stride: 8
  depth_scale: 0.001
  min_depth_m: 0.1
  obstacle_max_range: 4.0
  raytrace_max_range: 5.0
  min_obstacle_height: 0.05
  max_obstacle_height: 1.8
  enable_global_obstacles: false

motion:
  enable_lateral: false
  min_vel_x: -0.2
  max_vel_x: 1.0
  max_vel_y: 0.0
  max_vel_theta: 1.0
  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 2.0

policy_command:
  min_vel_x: -0.6
  max_vel_x: 1.0
  max_vel_y: 0.5
  max_vel_theta: 1.57
  min_abs_vel_theta: 1.0

footprint:
  polygon: "[[0.22, 0.18], [0.22, -0.18], [-0.18, -0.18], [-0.18, 0.18]]"
  padding: 0.08

dds:
  transport: udp
  topic: rt/run_command/cmd
  udp_host: 127.0.0.1
  udp_port: 18080
  default_height: 0.8
  invert_y: true
  invert_yaw: false
  cmd_timeout_sec: 0.5
  publish_rate_hz: 100.0
